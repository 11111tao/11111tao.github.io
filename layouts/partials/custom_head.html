<!-- 自定义 favicon 声明，覆盖主题默认的 shortcut icon -->
<link rel="icon" type="image/svg+xml" href="{{ "images/favicon-wave.svg" | absURL }}" />
<link rel="icon" type="image/png" sizes="32x32" href="{{ "images/favicon-32.png" | absURL }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ "images/apple-touch-icon.png" | absURL }}" />
<meta name="theme-color" content="#3273dc" />

<style>
  .about-hero {
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 1.5rem;
    align-items: center;
    margin: 2rem 0 2.5rem;
  }

  .about-avatar {
    width: 112px;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 50%;
  }

  .about-kicker {
    margin: 0 0 0.35rem;
    color: var(--link-color);
    font-family: monospace;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
  }

  .about-hero h1 {
    margin: 0;
    font-size: clamp(1.7rem, 5vw, 2.5rem);
    line-height: 1.2;
  }

  .about-lead {
    margin: 0.75rem 0 0;
    font-size: 1.05rem;
    line-height: 1.75;
  }

  .about-cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.9rem;
    margin: 1.5rem 0 2rem;
  }

  .about-cards section {
    padding: 1.1rem;
    border: 1px solid color-mix(in srgb, var(--text-color) 18%, transparent);
    border-radius: 12px;
  }

  .about-cards span {
    color: var(--link-color);
    font-size: 0.8rem;
  }

  .about-cards h3 {
    margin: 0.35rem 0 0.45rem;
  }

  .about-cards p {
    margin: 0;
  }

  .about-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.65rem;
    margin-top: 2rem;
  }

  .about-links a {
    padding: 0.35rem 0.7rem;
    border: 1px solid currentColor;
    border-radius: 999px;
  }

  @media (max-width: 560px) {
    .about-hero {
      grid-template-columns: 76px 1fr;
      gap: 1rem;
    }

    .about-avatar {
      width: 76px;
    }

    .about-cards {
      grid-template-columns: 1fr;
    }
  }
</style>
